[workspace]
resolver = "3"
members = [
    "crates/dictionary/word",
    "crates/dictionary/entry",
    "crates/dictionary/service",
    "crates/study/quiz",
    "crates/study/answer",
    "crates/study/workspace",
    "crates/study/service",
    "crates/core",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
publish = false

[workspace.dependencies]
# dictionary group
dictionary-word = { path = "crates/dictionary/word" }
dictionary-entry = { path = "crates/dictionary/entry" }
dictionary = { path = "crates/dictionary/service" }
# study group
study-quiz = { path = "crates/study/quiz" }
study-answer = { path = "crates/study/answer" }
study-workspace = { path = "crates/study/workspace" }
study = { path = "crates/study/service" }

# external
sea-orm = { version = "2.0.4", default-features = false, features = ["macros", "with-json", "with-chrono", "sqlx-sqlite", "runtime-tokio"] }
sea-orm-migration = { version = "2.0.4", default-features = false, features = ["sqlx-sqlite", "runtime-tokio"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
specta = { version = "=2.0.0-rc.25", features = ["derive", "chrono"] }
rand = "0.9"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }
tempfile = "3"
tauri = { version = "2.12" }
tauri-build = { version = "2" }
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }
specta-typescript = "0.0.12"
tauri-plugin-dialog = "2.8"
cargo_metadata = "0.23"
