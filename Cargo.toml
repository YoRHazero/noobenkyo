[workspace]
resolver = "3"
members = [
    "crates/dictionary/word",
    "crates/dictionary/entry",
    "crates/dictionary/service",
    "crates/study/quiz",
    "crates/study/learn",
    "crates/study/review",
    "crates/study/service",
    "crates/listening/drama",
    "crates/listening/script",
    "crates/listening/service",
    "crates/inbox/service",
    "crates/agent/tools",
    "crates/agent/cli",
    "crates/ai/invoker",
    "crates/ai/pipeline",
    "crates/ai/service",
    "crates/core",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
publish = false

[workspace.dependencies]
# dictionary group
dictionary-word = { path = "crates/dictionary/word" }
dictionary-entry = { path = "crates/dictionary/entry" }
dictionary = { path = "crates/dictionary/service" }
# study group
study-quiz = { path = "crates/study/quiz" }
study-learn = { path = "crates/study/learn" }
study-review = { path = "crates/study/review" }
study = { path = "crates/study/service" }
# listening group
listening-drama = { path = "crates/listening/drama" }
listening-script = { path = "crates/listening/script" }
listening = { path = "crates/listening/service" }
# inbox group
inbox = { path = "crates/inbox/service" }
# agent group
agent-tools = { path = "crates/agent/tools" }
# ai group
ai-invoker = { path = "crates/ai/invoker" }
ai-pipeline = { path = "crates/ai/pipeline" }
ai = { path = "crates/ai/service" }

# external
sea-orm = { version = "2.0.4", default-features = false, features = ["macros", "with-json", "with-chrono", "with-uuid", "sqlx-sqlite", "runtime-tokio"] }
sea-orm-migration = { version = "2.0.4", default-features = false, features = ["sqlx-sqlite", "runtime-tokio"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
specta = { version = "=2.0.0-rc.25", features = ["derive", "chrono", "uuid"] }
rand = "0.9"
uuid = { version = "1", features = ["v4", "serde"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }
tempfile = "3"
tauri = { version = "2.12" }
tauri-build = { version = "2" }
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }
specta-typescript = "0.0.12"
tauri-plugin-dialog = "2.8"
tauri-plugin-fs = "2.7"
tauri-plugin-log = "2.10"
cargo_metadata = "0.23"
clap = { version = "4", features = ["derive"] }
dirs = "7"
notify = "8"
base64 = "0.22"
sha2 = "0.10"
log = "0.4"
async-stream = "0.3"
futures-util = "0.3"
